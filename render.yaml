previews:
  generation: off

projects:
  - name: OpenVote
    environments:
      - name: production
        services:
          - type: web
            name: openvote
            runtime: docker
            plan: 0.5c-512mb
            region: frankfurt
            autoDeployTrigger: checksPass
            dockerfilePath: ./infra/demand.Dockerfile
            dockerContext: .
            healthCheckPath: /health
            domains:
              - openvote.com.ua
            envVars:
              - key: OPENVOTE_ENVIRONMENT
                value: demand
              - key: OPENVOTE_PUBLIC_ORIGIN
                value: https://openvote.com.ua
              - key: DEMAND_DATABASE_URL
                fromDatabase:
                  name: openvote-demand
                  property: connectionString
              - key: OPENAI_API_KEY
                sync: false
        databases:
          - name: openvote-demand
            databaseName: openvote_demand
            user: openvote_demand
            plan: 0.1c-256mb
            diskSizeGB: 1
            postgresMajorVersion: "18"
            region: frankfurt
            ipAllowList: []
          - name: openvote-identity
            databaseName: openvote_identity
            user: openvote_identity
            plan: 0.1c-256mb
            diskSizeGB: 1
            postgresMajorVersion: "18"
            region: frankfurt
            ipAllowList: []
          - name: openvote-ballot
            databaseName: openvote_ballot
            user: openvote_ballot
            plan: 0.1c-256mb
            diskSizeGB: 1
            postgresMajorVersion: "18"
            region: frankfurt
            ipAllowList: []
          - name: openvote-management
            databaseName: openvote_management
            user: openvote_management
            plan: 0.1c-256mb
            diskSizeGB: 1
            postgresMajorVersion: "18"
            region: frankfurt
            ipAllowList: []
