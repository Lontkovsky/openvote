name: Verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: true
          persist-credentials: false
      - name: Public artifact hygiene
        run: python3 scripts/scan-public.py
      - name: Build pinned reference core
        run: docker build --platform linux/amd64 --target crypto-runtime -f infra/crypto.Dockerfile -t openvote-crypto:3.3.0 .
      - name: Build and check Render runtime
        run: |
          docker build --platform linux/amd64 --target render-runtime -f infra/crypto.Dockerfile -t openvote-render:ci .
          docker run --rm --platform linux/amd64 --entrypoint node openvote-render:ci scripts/test-render-gateway.ts
      - name: Build minimal demand launch image
        run: docker build --platform linux/amd64 -f infra/demand.Dockerfile -t openvote-demand:ci .
      - name: Install pinned runtime scanner
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.70.0
          cache: true
      - name: Report runtime vulnerabilities
        run: |
          trivy image --scanners vuln --pkg-types os,library --severity HIGH,CRITICAL --exit-code 0 --no-progress --timeout 10m openvote-crypto:3.3.0
          trivy image --scanners vuln --pkg-types os,library --severity HIGH,CRITICAL --exit-code 0 --no-progress --timeout 10m openvote-render:ci
          trivy image --scanners vuln --pkg-types os,library --severity HIGH,CRITICAL --exit-code 0 --no-progress --timeout 10m openvote-demand:ci
      - name: Reject fixable runtime vulnerabilities
        run: |
          trivy image --scanners vuln --pkg-types os,library --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress --timeout 10m openvote-crypto:3.3.0
          trivy image --scanners vuln --pkg-types os,library --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress --timeout 10m openvote-render:ci
          trivy image --scanners vuln --pkg-types os,library --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress --timeout 10m openvote-demand:ci
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.20.0
      - name: Install locked workspace
        run: npm install -g pnpm@10.33.0 && pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Verify reproducible clients and release evidence
        run: pnpm release:verify artifacts/release-ci
      - name: Bootstrap isolated test services
        run: |
          pnpm bootstrap
          pnpm migrate
      - name: Start local application
        run: |
          node scripts/dev.mjs > .runtime/dev.log 2>&1 &
          for port in 4301 4302 4303 4312 4313; do
            curl --fail --silent --retry 10 --retry-connrefused --retry-delay 1 "http://127.0.0.1:$port/health" > /dev/null
          done
      - name: Types, builds and real service contracts
        run: pnpm types && pnpm build && pnpm build:demand && pnpm smoke && pnpm test --reporter=default --reporter=json --outputFile=artifacts/services/tests.json
      - name: Real encrypted voting and adversarial verification
        run: sh scripts/test-reference.sh
      - name: Verify public artifact without network or private storage
        run: sh scripts/verify.sh artifacts/reference/election.bel
      - name: Check generated public artifacts
        run: python3 scripts/scan-public.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reference-public-evidence
          path: artifacts/reference
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-public-evidence
          path: artifacts/release-ci
          retention-days: 14
